 </div>

 <div class="smart-panel">

   ${seqRows.map(x=>{const rate=x.sent?(x.replies/x.sent*100):0;const width=Math.max(5,Math.round(x.sent/maxSeq*100));return `<div style="display:grid;grid-template-columns:95px minmax(120px,1fr) 80px 70px;gap:10px;align-items:center;margin:11px 0">

    <div style="text-align:right">${x.sent.toLocaleString()}</div><div style="text-align:right;font-weight:700">${rate.toFixed(1)}%</div>
   </div>`}).join('')}
  </div>
 </div>
 </div>`;

function updateCampaignInboxSummary(){
 const selected=emailAccounts.map((a,i)=>({
   email:a.email,
   active:a.active,
   use:!!document.getElementById("cUseInbox"+i)?.checked,
   limit:Number(document.getElementById("cInboxLimit"+i)?.value||0)
 })).filter(x=>x.use && x.limit>0);
 const total=selected.reduce((sum,x)=>sum+x.limit,0);
 const el=document.getElementById("cInboxSummary");
 if(el) el.textContent=selected.length
   ? `${selected.length} inbox${selected.length===1?'':'es'} selected · ${total} emails/day combined`
   : "Select at least one active inbox.";
}
function getCampaignInboxPlan(){
 return emailAccounts.map((a,i)=>({
   email:a.email,
   use:!!document.getElementById("cUseInbox"+i)?.checked,
   dailyLimit:Number(document.getElementById("cInboxLimit"+i)?.value||0)
 })).filter(x=>x.use && x.dailyLimit>0);
}
