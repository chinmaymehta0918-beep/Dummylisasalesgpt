function generateAISequence(){
 const offer=document.getElementById("aiOffer").value.trim()||"our solution";
 const persona=document.getElementById("aiPersona").value.trim()||"sales leader";
 const tone=document.getElementById("aiTone").value;
 const count=Number(document.getElementById("aiSteps").value);
 const context=document.getElementById("aiContext").value.trim()||"helping teams improve outbound efficiency";
 const templates=[
  {subject:"Quick idea for {{company}}",body:`Hi {{first_name}},\n\nI noticed {{company}} is growing its sales motion and thought this might be relevant.\n\nWe help ${persona}s ${context} with ${offer}.\n\nWorth a quick conversation?\n\nBest,\nChinmay`},
  {subject:"Re: Quick idea for {{company}}",body:`Hi {{first_name}},\n\nJust following up on my note below.\n\nThe reason I reached out is simple: ${context}.\n\nHappy to share how ${offer} could fit into what {{company}} is doing.\n\nOpen to a quick chat?\n\nBest,\nChinmay`},
  {subject:"One more thought for {{company}}",body:`Hi {{first_name}},\n\nOne more thought before I close the loop.\n\nIf ${context} is a priority for {{company}}, I can show you a short example of what we're doing with ${offer}.\n\nWould that be useful?\n\nBest,\nChinmay`},
  {subject:"Should I close the loop?",body:`Hi {{first_name}},\n\nI haven't heard back, so I'll close the loop here.\n\nIf ${offer} becomes relevant for {{company}}, feel free to reply and I'll send over the details.\n\nBest,\nChinmay`}
 ];
 builderSteps=templates.slice(0,count).map((x,i)=>({...x,delay:i===0?0:(i===1?3:(i===2?4:7)),unit:"days"}));
 const result=document.getElementById("aiResult");
 result.style.display="block";
 result.innerHTML=`<b>Sequence generated</b><br>${count} emails created in a ${tone.toLowerCase()} tone. Review and edit them below before launching.`;
 renderSequenceBuilder();
}
function clearAISequence(){document.getElementById("aiResult").style.display="none";}

function renderSequenceBuilder(){
 const el=document.getElementById("sequenceBuilder");
 if(!el)return;
 el.innerHTML=builderSteps.map((s,i)=>`<div class="sequence-step">
   <div class="step-head"><div class="step-number">Step ${i+1}</div>${i>0?`<button class="remove" onclick="removeSequenceStep(${i})">Remove</button>`:""}</div>
   <div class="field"><label>Subject</label><input value="${escapeHtml(s.subject)}" oninput="updateStep(${i},'subject',this.value)"></div>
   <div class="field"><label>Email content</label><textarea oninput="updateStep(${i},'body',this.value)">${escapeHtml(s.body)}</textarea></div>
   ${i<builderSteps.length-1?`<div class="delay"><b>Wait before next step:</b><input type="number" min="0" value="${s.delay}" oninput="updateStep(${i},'delay',this.value)"><select onchange="updateStep(${i},'unit',this.value)"><option ${s.unit==="hours"?"selected":""}>hours</option><option ${s.unit==="days"?"selected":""}>days</option></select></div>`:"<div class='small-help'>This is the final step in the sequence.</div>"}
   <div class="small-help">Click a variable button above to copy a variable into your email, then place it where you want.</div>
 </div>`).join("");
 updatePreview();
}

function escapeHtml(v){return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function updateStep(i,key,value){builderSteps[i][key]=value;updatePreview();}
function addSequenceStep(){builderSteps.push({subject:"",body:"Hi {{first_name}},\n\n",delay:3,unit:"days"});renderSequenceBuilder();}
function removeSequenceStep(i){builderSteps.splice(i,1);renderSequenceBuilder();}
function addCustomVariable(){
 const n=prompt("Variable name (without spaces):","custom_field");
 if(!n)return;
 const clean=n.toLowerCase().replace(/[^a-z0-9_]/g,"_");
 const label=prompt("Display label:",clean.replace(/_/g," "));
 const example=prompt("Example value:","Example value");
 customVariables.push({name:clean,label:label||clean,example:example||"Example"});
 const c=document.getElementById("app");c.innerHTML=createPage();renderSequenceBuilder();
}
function removeCustomVariable(i){customVariables.splice(i,1);const c=document.getElementById("app");c.innerHTML=createPage();renderSequenceBuilder();}
function insertVariable(name){
 const active=document.activeElement;
 if(active && (active.tagName==="INPUT"||active.tagName==="TEXTAREA")) {
   const start=active.selectionStart||active.value.length,end=active.selectionEnd||active.value.length;
   active.value=active.value.slice(0,start)+"{{"+name+"}}"+active.value.slice(end);

function toggleReplyFollowupDays(){
 const enabled=document.getElementById("continueAfterReply")?.checked;
 const wrap=document.getElementById("replyFollowupDaysWrap");
 const summary=document.getElementById("replyFollowupSummary");
 if(wrap) wrap.style.display=enabled?"block":"none";
 if(summary) summary.innerHTML=enabled
   ? `<b>Lisa will wait ${Number(document.getElementById("replyFollowupDays")?.value||2)} days</b> after a reply before sending the next campaign email.`
   : `<b>Default:</b> A reply stops the sequence. You can turn this on if you want another email after the response.`;
}
function getReplyFollowupSettings(){
 return {
   continueAfterReply: !!document.getElementById("continueAfterReply")?.checked,
   daysAfterReply: Math.max(1, Number(document.getElementById("replyFollowupDays")?.value||2))
 };

function launchBuilderCampaign(){
 const name=document.getElementById("cName").value.trim();
 const audience=document.getElementById("cAudience")?.value.trim();
 const contacts=Number(document.getElementById("cContacts")?.value||0);
 const source=document.getElementById("cSource")?.value;
 const inboxPlan=getCampaignInboxPlan();
 if(!name||!audience||!contacts||!source){alert("Please complete the campaign name, audience, contact count and contact source.");return;}
 if(!inboxPlan.length){alert("Choose at least one active inbox and set its daily email limit.");return;}
 if(builderSteps.some(s=>!s.subject.trim()||!s.body.trim())){alert("Every sequence step needs a subject and email body.");return;}
 const totalDaily=inboxPlan.reduce((sum,x)=>sum+x.dailyLimit,0);
 campaigns.push({name,contacts,sent:0,delivery:0,replies:0,status:"Paused",inboxPlan,totalDaily,replyFollowup:getReplyFollowupSettings()});
 alert("Campaign created as Paused. Review it in Campaigns before turning it ON.");
 go("campaigns");
}

 document.body.insertAdjacentHTML("beforeend",`<div class="modal-backdrop" id="replyModal" onclick="if(event.target.id==='replyModal')closeReplyComposer()">

 localStorage.setItem("salesgpt_workspace",JSON.stringify({name,tz,start:startTime,end:endTime,basis,days,priority}));

function campaignLeadStatus(c){
  const total = Math.max(0, Number(c?.contacts || 0));
  const sent = Math.min(total, Math.max(0, Number(c?.sent || 0)));
  const remaining = Math.max(0, Number(c?.yetToContact ?? (total - sent)));
  const active = Math.max(0, Number(c?.activeLeads ?? Math.max(0, sent - Math.max(0, Number(c?.completedLeads || 0)))));
  return {total, sent, active, remaining};
}
function campaignLeadStatusHtml(c){
  const s = campaignLeadStatus(c);
  return `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">
      <div style="padding:10px;border:1px solid #ececf1;border-radius:9px;background:#fafafd">

        <div style="font-size:18px;font-weight:700;margin-top:3px">${s.active.toLocaleString()}</div>

      <div style="padding:10px;border:1px solid #ececf1;border-radius:9px;background:#fafafd">
        <div class="muted" style="font-size:12px">Yet to be contacted</div>
        <div style="font-size:18px;font-weight:700;margin-top:3px">${s.remaining.toLocaleString()}</div>
      </div>
    </div>`;
}

let resumeSequenceTarget = null;

function openResumeSequenceModal(target){
  resumeSequenceTarget = target || null;
  const modal=document.getElementById("resumeSequenceModal");
  const input=document.getElementById("resumeSequenceDays");
  if(input) input.value=2;
  const title=modal?.querySelector("h3");
  if(title) title.textContent = (target && target.classification==="Out of Office") ? "Resume after out of office" : "Resume sequence";
  if(modal) modal.style.display="flex";
  updateResumeSequenceSummary();
}

function closeResumeSequenceModal(){
  const modal=document.getElementById("resumeSequenceModal");
  if(modal) modal.style.display="none";
  resumeSequenceTarget=null;
}

function updateResumeSequenceSummary(){
  const days=Math.max(0,Number(document.getElementById("resumeSequenceDays")?.value||2));
  const el=document.getElementById("resumeSequenceSummary");
  if(el) el.innerHTML = days===0
    ? "<b>Resume immediately.</b> Lisa can continue with the next scheduled email."
    : `<b>Resume after ${days} day${days===1?"":"s"}.</b> Lisa will wait before continuing the sequence.`;
}

function confirmResumeSequence(){
  const days=Math.max(0,Number(document.getElementById("resumeSequenceDays")?.value||2));

  // If a real lead object was supplied, keep the state on that object.
  if(resumeSequenceTarget && typeof resumeSequenceTarget==="object"){
    resumeSequenceTarget.sequenceStopped=false;
    resumeSequenceTarget.sequenceResumeAfterDays=days;
    resumeSequenceTarget.sequenceResumeScheduledAt=Date.now() + days*24*60*60*1000;
    if("status" in resumeSequenceTarget && (resumeSequenceTarget.status==="Replied" || resumeSequenceTarget.status==="Out of Office")){
      resumeSequenceTarget.status="Active";
    }
  }

  closeResumeSequenceModal();

  if(typeof render==="function") render();
  else if(typeof renderInbox==="function") renderInbox();

  alert(days===0
    ? "Sequence resumed immediately."
    : `Sequence will resume after ${days} day${days===1?"":"s"}.`);
}

document.addEventListener("input",e=>{
  if(e.target && e.target.id==="resumeSequenceDays") updateResumeSequenceSummary();
});

function renderDashboardAnalytics(){
  const host=document.getElementById("dashboardAnalyticsCards");
  if(!host) return;
  const periodKey=(typeof selectedPeriod!=="undefined"?selectedPeriod:"7");
  const p=(typeof periods!=="undefined"&&periods[periodKey])?periods[periodKey]:periods["7"];
  const sent=Number(p.sent||0), delivered=Number(p.delivered||0), replies=Number(p.replies||0);
  const delivery=sent?(delivered/sent*100):0;
  const reply=sent?(replies/sent*100):0;
  const positive=Math.round(replies*.42);
  const meetings=Math.round(positive*.18);

  const cards=[
    ["Emails sent",sent.toLocaleString(),"activity"],
    ["Delivered",delivery.toFixed(1)+"%","delivery"],
    ["Replies",replies.toLocaleString(),"responses"],
    ["Positive replies",positive.toLocaleString(),"interest"],
    ["Meetings booked",meetings.toLocaleString(),"outcome"]
  ];
  host.innerHTML=cards.map(c=>`
    <div style="border:1px solid #e7e7ec;border-radius:10px;padding:14px;background:#fff">
      <div class="muted" style="font-size:12px">${c[0]}</div>
      <div style="font-size:24px;font-weight:700;margin-top:5px">${c[1]}</div>
      <div class="small-help" style="margin-top:4px">${c[2]}</div>
    </div>`).join("");
}
